# rsyslog drop-in for the Caetra host (the machine running caetra.py).
#
# Caetra emits one structured JSON event per shield trigger to the local
# syslog facility LOCAL0 (see src/utils/logger_setup.py, "logsiem" handler
# / "caetra_siem" logger), separate from its normal human-readable logging
# on the "syslog" facility. This rule splits LOCAL0 into its own file so a
# Wazuh agent can tail just the Caetra SIEM events.
#
# Install as: /etc/rsyslog.d/49-caetra-siem.conf
# Then: mkdir -p /var/log/caetra && systemctl restart rsyslog

local0.*    /var/log/caetra/siem.log
& stop
