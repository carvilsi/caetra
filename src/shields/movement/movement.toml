# this is the configuration file related with Caetra's movement Shield
# add here all the user configurable parameters to tune the
# behaviour of the shield

# Name of the Caetra Shield and generic config values
# case sensitive must match with SHIELD_NAME on python side
[movement]

# if this shield is enable
enable = true


# a description that will logged
description = "Triggers when the accelerometer (lis3lv02d) detects that the machine has been moved"


# label to describe what happen on physical world
action_label = "machine moved"


# to configure special features
[movement.features]

# minimum change, in mg (1000 mg = 1 g), on any axis from the resting position
# to consider that the machine has been moved; resting noise on a Dell
# Latitude E7450 is around 18-36 mg
threshold = 150
# the feature variable
limit_sending = true
max_actions = 2
# time in seconds to start sending notifications again
cool_down_time = 10
